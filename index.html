<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Garden 3D</title>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a28 0%, #2a2a38 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: 'Inter', sans-serif;
    transition: opacity 0.5s ease-out;
  ">
    <div style="text-align: center; max-width: 400px; width: 90%;">
      <h1 style="
        color: #ffffff;
        font-size: 32px;
        font-weight: 600;
        margin: 0 0 12px 0;
        letter-spacing: 0.5px;
      ">Zen Garden</h1>
      <p style="
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        margin: 0 0 40px 0;
      ">Loading experience...</p>

      <!-- Progress Bar Container -->
      <div style="
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 12px;
      ">
        <div id="loading-bar" style="
          width: 0%;
          height: 100%;
          background: linear-gradient(90deg, #667799 0%, #8899bb 100%);
          transition: width 0.3s ease-out;
          border-radius: 2px;
        "></div>
      </div>

      <!-- Percentage Text -->
      <p id="loading-percentage" style="
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        margin: 0;
        font-weight: 500;
      ">0%</p>
    </div>
  </div>

  <div
    style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-family: 'Inter', sans-serif; font-size: 11px; color: rgba(255,255,255,0.8); z-index: 1000; user-select: none; pointer-events: none;">
    Vibe-Coded by Haris Putratama
  </div>
  <canvas class="webgl"></canvas>
  <script type="module" src="/main.js"></script>
</body>

</html>
