<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Garden 3D</title>
</head>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a1a28 0%, #2a2a38 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: 'Inter', sans-serif;
    transition: opacity 0.5s ease-out;
  ">
    <div style="text-align: center; max-width: 400px; width: 90%;">
      <h1 style="
        color: #ffffff;
        font-size: 32px;
        font-weight: 600;
        margin: 0 0 12px 0;
        letter-spacing: 0.5px;
      ">Zen Garden</h1>
      <p style="
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        margin: 0 0 40px 0;
      ">Loading experience...</p>

      <!-- Progress Bar Container -->
      <div style="
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 12px;
      ">
        <div id="loading-bar" style="
          width: 0%;
          height: 100%;
          background: linear-gradient(90deg, #667799 0%, #8899bb 100%);
          transition: width 0.3s ease-out;
          border-radius: 2px;
        "></div>
      </div>

      <!-- Percentage Text -->
      <p id="loading-percentage" style="
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        margin: 0;
        font-weight: 500;
      ">0%</p>
    </div>
  </div>

  <!-- Fullscreen Button -->
  <button id="fullscreen-btn" style="
    position: fixed;
    top: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    cursor: pointer;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  " onmouseover="this.style.background='rgba(0, 0, 0, 0.7)'; this.style.borderColor='rgba(255, 255, 255, 0.4)'"
    onmouseout="this.style.background='rgba(0, 0, 0, 0.5)'; this.style.borderColor='rgba(255, 255, 255, 0.2)'">
    <!-- Fullscreen Icon SVG -->
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path id="fs-expand"
        d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
      <path id="fs-compress"
        d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"
        style="display: none;" />
    </svg>
  </button>

  <!-- Walk Button -->
  <button id="walk-btn" style="
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px;
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    z-index: 1000;
    letter-spacing: 0.5px;
  " onmouseover="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.transform='translateX(-50%) scale(1.05)'"
    onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'; this.style.transform='translateX(-50%) scale(1)'">
    Walk
  </button>

  <!-- WASD Hint -->
  <div id="wasd-hint" style="
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.6);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1000;
    text-align: center;
  ">
    Use <span style="color: white; font-weight: 600;">WASD</span> to move<br>
    <span style="font-size: 10px; opacity: 0.8;">ESC to exit</span>
  </div>

  <div
    style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-family: 'Inter', sans-serif; font-size: 11px; color: rgba(255,255,255,0.8); z-index: 1000; user-select: none; pointer-events: none;">
    Vibe-Coded by Haris Putratama
  </div>
  <canvas class="webgl"></canvas>
  <script type="module" src="/main.js"></script>
</body>

</html>
